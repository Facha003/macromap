# Publishes the browser-only build to GitHub Pages: https://<user>.github.io/<repo>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: refresh the restaurant snapshot
  workflow_dispatch:
    inputs:
      limit:
        description: "Max restaurant websites to check for menus"
        required: false
        default: "600"
      recheck:
        description: "Re-check sites with these statuses now (e.g. none,no-text)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  models: read # free GitHub Models AI for reading menus

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Start from the last good snapshot so a failed OSM query never ships an empty site.
      - uses: actions/cache/restore@v4
        with:
          path: public/places
          key: places-${{ github.run_id }}
          restore-keys: places-
      - name: Restaurant snapshot from OpenStreetMap
        id: places
        continue-on-error: true
        run: npm run places:build
      - if: steps.places.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/places
          key: places-${{ github.run_id }}
      - if: steps.places.outcome != 'success'
        run: echo "::warning::Places snapshot failed; deploying the previous snapshot (if any)"
      # Menus read from restaurants' own websites — refreshed nightly (or on manual runs), reused on pushes.
      - uses: actions/cache/restore@v4
        with:
          path: public/menus
          key: menus-${{ github.run_id }}
          restore-keys: menus-
      - name: Install headless browser for JavaScript-only restaurant sites
        if: github.event_name != 'push'
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Read menus from restaurant websites
        id: menus
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 55
        run: npm run menus:crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MENU_CRAWL_LIMIT: ${{ github.event.inputs.limit || '600' }}
          MENU_RECHECK: ${{ github.event.inputs.recheck || '' }}
          MENU_RENDER: "1"
          MENU_CRAWL_MINUTES: ${{ github.event_name == 'workflow_dispatch' && '45' || '25' }}
      - if: steps.menus.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/menus
          key: menus-${{ github.run_id }}
      - name: Build static site
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
