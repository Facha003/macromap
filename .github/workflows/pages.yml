# Publishes the browser-only build to GitHub Pages: https://<user>.github.io/<repo>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: refresh the restaurant snapshot
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Start from the last good snapshot so a failed OSM query never ships an empty site.
      - uses: actions/cache/restore@v4
        with:
          path: public/places
          key: places-${{ github.run_id }}
          restore-keys: places-
      - name: Restaurant snapshot from OpenStreetMap
        id: places
        continue-on-error: true
        run: npm run places:build
      - if: steps.places.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/places
          key: places-${{ github.run_id }}
      - if: steps.places.outcome != 'success'
        run: echo "::warning::Places snapshot failed; deploying the previous snapshot (if any)"
      - name: Build static site
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
